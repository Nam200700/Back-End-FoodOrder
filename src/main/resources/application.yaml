spring:
  application:
    name: DATN
  profiles:
    # Mặc định là prod — mắt xích cuối của nguyên tắc "quên khai gì thì rơi vào cấu hình
    # thật". Để mặc định dev thì mọi thứ bên dưới thành vô nghĩa: bản deploy quên biến môi
    # trường sẽ bật profile dev, và application-dev.yaml kéo hết URL về localhost.
    #
    # Máy dev phải khai SPRING_PROFILES_ACTIVE=dev (đặt trong cấu hình chạy của IDE là xong).
    # Quên thì app DỪNG NGAY vì profile prod bắt buộc có DB_USERNAME/DB_PASSWORD — hỏng ồn
    # ào ngay trên máy mình, thay vì hỏng lặng lẽ trên bản deploy.
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    open-in-view: false
    properties:
      hibernate.format_sql: true
      # Gom các lazy-load (collection & *-to-one) thành câu IN(...) theo lô thay vì N
      # câu lẻ → khử N+1 khi render danh sách (đơn hàng, items, shipper...). Toàn app.
      hibernate.default_batch_fetch_size: 100
      # Pin the dialect so `validate` matches the Flyway DDL (generated with the
      # same dialect). Avoids MySQL version-detection drift.
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Google OAuth2 — uncomment and set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET to enable.
  # When this block is absent, no ClientRegistrationRepository bean is created and
  # OAuth2 login stays disabled (the app still starts normally).
  #  security:
  #    oauth2:
  #      client:
  #        registration:
  #          google:
  #            client-id: ${GOOGLE_CLIENT_ID}
  #            client-secret: ${GOOGLE_CLIENT_SECRET}
  #            scope: email, profile

server:
  port: 3000
  # Ứng dụng luôn chạy sau nginx ở môi trường thật (nginx nhận HTTPS rồi proxy sang HTTP
  # nội bộ). Bật cờ này để Spring đọc X-Forwarded-Proto/Host mà nginx gửi kèm, nhờ đó
  # request.isSecure() trả về đúng và cookie tự bật cờ Secure. Ở máy dev không có proxy
  # nên không có header nào để đọc — cờ này thành vô hại.
  forward-headers-strategy: framework

# ─────────────────────────────────────────────────────────────────────────────────────
#  NGUYÊN TẮC: giá trị mặc định ở file này là giá trị DÙNG CHO MÔI TRƯỜNG THẬT.
#
#  Trước đây mặc định là localhost, nên chỉ cần quên SPRING_PROFILES_ACTIVE=prod hoặc
#  quên một biến môi trường là bản deploy âm thầm chạy bằng cấu hình máy cá nhân: CORS
#  chặn tên miền thật (mọi thao tác ghi trả 403 trong khi GET vẫn chạy nên rất khó đoán),
#  link mời đơn nhóm trỏ về localhost.
#
#  Đảo lại: quên khai gì thì rơi vào cấu hình production, còn máy dev thì đã có
#  application-dev.yaml ghi đè ngược về localhost. Sai sót lúc deploy vì thế không còn
#  âm thầm nữa — cùng lắm là máy dev chạy nhầm cấu hình thật, chuyện lộ ra ngay lập tức.
# ─────────────────────────────────────────────────────────────────────────────────────
app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://clbdeveloper.com}
  oauth2:
    # Success handler redirects here with ?token=...&refreshToken=...
    redirect-uri: ${OAUTH2_REDIRECT_URI:https://clbdeveloper.com/oauth2/callback}
  jwt:
    # Minimum 32 chars (256-bit) for HS256
    secret: ${JWT_SECRET:antigravity-food-dev-secret-key-change-me-256bit}
    access-token-expiry: 900000        # 15 minutes (ms)
    refresh-token-expiry: 604800000    # 7 days (ms)
  auth:
    cookie:
      # Refresh token đặt trong cookie HttpOnly (JS không đọc được -> chống XSS trộm token).
      #
      # auto = tự suy từ giao thức thật của request (xem AuthController#resolveCookieSecure):
      # chạy HTTPS thì bật cờ Secure, chạy HTTP ở máy dev thì tắt. Không phải khai gì thêm
      # khi deploy, và cũng không thể khai sai. Vẫn ép được bằng true/false nếu cần.
      secure: ${AUTH_COOKIE_SECURE:auto}
      # Lax hợp lệ khi FE/BE cùng site. Chỉ khi tách backend sang tên miền khác mới cần
      # None, và None bắt buộc đi kèm secure=true.
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
  cors:
    # Trình duyệt LUÔN gửi header Origin với POST/PUT/PATCH/DELETE, kể cả cùng origin —
    # thiếu tên miền ở đây là hỏng toàn bộ thao tác ghi. Khai cả dạng có www lẫn không www
    # vì so khớp Origin là so chuỗi chính xác. localhost do application-dev.yaml thêm vào.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://clbdeveloper.com,https://www.clbdeveloper.com}
  shipping:
    base-fee: 15000        # VND for first 2km
    base-km: 2.0
    per-km-fee: 5000       # VND per extra km
    max-distance-km: 10.0
  order:
    pending-timeout-minutes: 5
  otp:
    length: 6
    ttl-minutes: 5
    max-fail-attempts: 3
    lockout-minutes: 10
    # Trần số lần xin mã MỖI NGÀY cho cùng một người nhận. Rate limit theo IP (RateLimitFilter)
    # đổi IP là lách được, mà mỗi tin SMS nay tốn tiền thật -> phải chặn thêm theo người nhận.
    max-per-recipient-per-day: 5
  speedsms:
    # Gửi SMS OTP qua SpeedSMS. Bỏ trống -> luồng gửi SMS báo lỗi rõ ràng, email vẫn chạy
    # bình thường. Lưu ý: tài khoản phải được SpeedSMS cấp quyền gửi qua API, nếu không
    # MỌI sms_type đều trả về "sender not found".
    access-token: ${SPEEDSMS_ACCESS_TOKEN:}
    # Để TRỐNG khi dùng sms-type 2 (SpeedSMS tự chọn số gửi ngẫu nhiên).
    # Chỉ điền khi đã có brandname riêng (type 3/4) hoặc deviceId app Android (type 5).
    sender: ${SPEEDSMS_SENDER:}
    # 2 = số ngẫu nhiên, KHÔNG cần brandname -> tài khoản mới gửi được ngay
    # 3/4 = cần brandname đã đăng ký (thiếu sẽ lỗi "sender not found")
    # 5 = gửi qua app Android bằng SIM của mình, khi đó SPEEDSMS_SENDER = deviceId
    sms-type: ${SPEEDSMS_SMS_TYPE:2}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:https://clbdeveloper.com/payment/result}
    ipn-url: ${VNPAY_IPN_URL:https://clbdeveloper.com/api/v1/payments/vnpay/ipn}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  openrouteservice:
    api-key: ${OPENROUTESERVICE_API_KEY}

platform:
  commission-rate: 0.10
