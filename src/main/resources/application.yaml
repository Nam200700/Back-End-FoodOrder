spring:
  application:
    name: DATN
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    open-in-view: false
    properties:
      hibernate.format_sql: true
      # Gom các lazy-load (collection & *-to-one) thành câu IN(...) theo lô thay vì N
      # câu lẻ → khử N+1 khi render danh sách (đơn hàng, items, shipper...). Toàn app.
      hibernate.default_batch_fetch_size: 100
      # Pin the dialect so `validate` matches the Flyway DDL (generated with the
      # same dialect). Avoids MySQL version-detection drift.
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Google OAuth2 — uncomment and set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET to enable.
  # When this block is absent, no ClientRegistrationRepository bean is created and
  # OAuth2 login stays disabled (the app still starts normally).
  #  security:
  #    oauth2:
  #      client:
  #        registration:
  #          google:
  #            client-id: ${GOOGLE_CLIENT_ID}
  #            client-secret: ${GOOGLE_CLIENT_SECRET}
  #            scope: email, profile

server:
  port: 8080

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth2:
    # Success handler redirects here with ?token=...&refreshToken=...
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
  jwt:
    # Minimum 32 chars (256-bit) for HS256
    secret: ${JWT_SECRET:antigravity-food-dev-secret-key-change-me-256bit}
    access-token-expiry: 900000        # 15 minutes (ms)
    refresh-token-expiry: 604800000    # 7 days (ms)
  auth:
    cookie:
      # Refresh token đặt trong cookie HttpOnly (JS không đọc được -> chống XSS trộm token).
      # Dev localhost chạy http nên secure=false; PROD (HTTPS) đặt AUTH_COOKIE_SECURE=true.
      # SameSite=Lax hợp lệ khi FE/BE cùng site (localhost khác port vẫn same-site); nếu FE và
      # BE ở hai domain khác nhau thật thì đặt AUTH_COOKIE_SAMESITE=None kèm secure=true.
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  shipping:
    base-fee: 15000        # VND for first 2km
    base-km: 2.0
    per-km-fee: 5000       # VND per extra km
    max-distance-km: 10.0
  order:
    pending-timeout-minutes: 5
  otp:
    length: 6
    ttl-minutes: 5
    max-fail-attempts: 3
    lockout-minutes: 10
    # Trần số lần xin mã MỖI NGÀY cho cùng một người nhận. Rate limit theo IP (RateLimitFilter)
    # đổi IP là lách được, mà mỗi tin SMS nay tốn tiền thật -> phải chặn thêm theo người nhận.
    max-per-recipient-per-day: 5
  speedsms:
    # Gửi SMS OTP qua SpeedSMS. Bỏ trống -> luồng gửi SMS báo lỗi rõ ràng, email vẫn chạy
    # bình thường. Lưu ý: tài khoản phải được SpeedSMS cấp quyền gửi qua API, nếu không
    # MỌI sms_type đều trả về "sender not found".
    access-token: ${SPEEDSMS_ACCESS_TOKEN:}
    # Để TRỐNG khi dùng sms-type 2 (SpeedSMS tự chọn số gửi ngẫu nhiên).
    # Chỉ điền khi đã có brandname riêng (type 3/4) hoặc deviceId app Android (type 5).
    sender: ${SPEEDSMS_SENDER:}
    # 2 = số ngẫu nhiên, KHÔNG cần brandname -> tài khoản mới gửi được ngay
    # 3/4 = cần brandname đã đăng ký (thiếu sẽ lỗi "sender not found")
    # 5 = gửi qua app Android bằng SIM của mình, khi đó SPEEDSMS_SENDER = deviceId
    sms-type: ${SPEEDSMS_SMS_TYPE:2}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  openrouteservice:
    api-key: ${OPENROUTESERVICE_API_KEY}

platform:
  commission-rate: 0.10
