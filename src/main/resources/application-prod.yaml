# Profile prod chỉ còn phần phụ thuộc hạ tầng của máy chủ.
#
# Các URL và CORS của tên miền thật KHÔNG nằm ở đây mà là giá trị mặc định trong
# application.yaml — chủ đích, để bản deploy quên bật SPRING_PROFILES_ACTIVE=prod thì
# vẫn chạy đúng cấu hình thật. Lặp lại ở cả hai nơi thì sớm muộn cũng lệch nhau.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fresh_delivery}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # schema managed by migrations
    show-sql: false

logging:
  level:
    org.example.datn: INFO
